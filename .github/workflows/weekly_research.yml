name: Weekly Research

on:
  workflow_dispatch:

  schedule:
    # Every Sunday at 00:00 UTC.
    # Bangladesh time: Sunday 06:00 AM.
    - cron: "0 0 * * 0"

concurrency:
  group: weekly-research
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-research:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"

      DATABASE_URL: ${{ secrets.DATABASE_URL }}

      REDDIT_API_ENABLED: "True"
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
      REDDIT_POST_LIMIT: "20"
      REDDIT_COMMENTS_PER_POST: "10"
      REDDIT_REQUEST_TIMEOUT: "20"

      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GEMINI_MAX_OUTPUT_TOKENS: "4096"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Validate required secrets
        shell: bash
        run: |
          required_vars=(
            DJANGO_SECRET_KEY
            DATABASE_URL
            REDDIT_CLIENT_ID
            REDDIT_CLIENT_SECRET
            REDDIT_USER_AGENT
            GEMINI_API_KEY
          )

          for variable_name in "${required_vars[@]}"; do
            if [ -z "${!variable_name}" ]; then
              echo "::error::$variable_name is missing."
              exit 1
            fi
          done

          if [ -z "$GEMINI_MODEL" ]; then
            echo "::error::Repository variable GEMINI_MODEL is missing."
            exit 1
          fi

      - name: Run Django system checks
        run: |
          python manage.py check

      - name: Apply database migrations
        run: |
          python manage.py migrate --noinput

      - name: Run weekly research
        run: |
          python manage.py run_research --continue-on-error